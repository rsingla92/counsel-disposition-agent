name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publish the runtime files only: not web/test or web/package.json.
      - name: Stage site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp web/index.html web/app.js web/lib.js web/style.css \
            web/config.js web/demo-messages.json "$RUNNER_TEMP/site/"
          cp -R web/replay "$RUNNER_TEMP/site/replay"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v4
