[project]
name = "counsel-eval"
version = "0.1.0"
description = "Eval harness for the Counsel disposition agent."
requires-python = ">=3.11,<3.12"
dependencies = [
  "pandas",
  "openpyxl",
  "PyYAML",
  "scipy",
  "jsonschema",
  "httpx",
  "scikit-learn",
]

[project.scripts]
counsel-eval = "counsel_eval.run:cli"

[dependency-groups]
dev = [
  "pytest",
  "pyink",
  "pylint",
  "respx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/counsel_eval"]

[tool.pyink]
line-length = 80
pyink-indentation = 2
pyink-use-majority-quotes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
