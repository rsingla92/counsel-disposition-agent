name = "counsel-disposition-agent"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Both providers are zero-data-retention endpoints on OpenRouter (checked
# 2026-11-03). An empty SECONDARY_MODEL or SECONDARY_PROVIDER turns the second
# model family off.
# Secrets (set with `wrangler secret put`): OPENROUTER_API_KEY, ACCESS_TOKEN.
[vars]
PRIMARY_MODEL = "anthropic/claude-sonnet-5.5"
PRIMARY_PROVIDER = "google-vertex"
SECONDARY_MODEL = "google/gemini-3.8-flash"
SECONDARY_PROVIDER = "google-vertex"
# Vertex rate-limits each model separately, so each model has its own queue
# (at most 6 connections in all). Sonnet alone at 3 in flight drew HTTP 429s
# on 2026-11-04. Flash reasons by default: on 2026-11-05 a sample call took
# 7.4 s with reasoning and 2.7 s with effort "low".
PRIMARY_MAX_IN_FLIGHT = "2"
SECONDARY_MAX_IN_FLIGHT = "4"
SECONDARY_REASONING_EFFORT = "low"
ALLOWED_ORIGIN = "https://counsel-disposition-web.counsel-demo.workers.dev"

# Saved eval runs for the Operations view (export_experiment.py output), read
# by GET /v1/experiments and POST /v1/experiments/:id/rescore. The namespace
# id is not a secret.
[[kv_namespaces]]
binding = "EXPERIMENTS"
id = "b2e6602a6b9a4a8ead5219ce464b81b3"
