name = "counsel-disposition-agent"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Both providers are zero-data-retention endpoints on OpenRouter (checked
# 2026-11-03). An empty SECONDARY_MODEL or SECONDARY_PROVIDER turns the second
# model family off.
# Secrets (set with `wrangler secret put`): OPENROUTER_API_KEY, ACCESS_TOKEN.
[vars]
PRIMARY_MODEL = "anthropic/claude-sonnet-5.5"
PRIMARY_PROVIDER = "google-vertex"
SECONDARY_MODEL = "google/gemini-4-argon"
SECONDARY_PROVIDER = "google-vertex"
ALLOWED_ORIGIN = "https://counsel-disposition-web.counsel-demo.workers.dev"
